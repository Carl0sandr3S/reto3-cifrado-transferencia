{% extends "base.html" %}
{% from "_icons.html" import hero_flow %}
{% block body %}
<div class="split">
  <section class="hero">
    <h1>Gestión de documentos</h1>
    <p>Envía y recupera archivos de forma segura: cada documento se cifra, se transfiere y se verifica de forma automática.</p>
    {{ hero_flow() }}
  </section>
  <section class="card">
    <h2>Iniciar sesión</h2>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      <button>Entrar</button>
    </form>
  </section>
</div>
{% endblock %}
